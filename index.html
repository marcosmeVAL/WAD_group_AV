<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="res/styles/css/stylesForIndex.css">
        <title>Home</title>
    </head>
    <body>
        <header class="top-bar">
            <nav class="nav">
                <a id="nav-home" href="index.html">Home</a>
                <a id="nav-add" href="addPost.html">Add Post</a>
                <div class="profile" aria-label="Login">
                    <img src="res/images/me.png" alt="Profile" class="profile-pic" id="profile-pic">
                    
                    <div class="dropdown" id="dropdown-menu">
                        <p class="user-name">John Doe</p>
                        <p class="user-email">john.doe@example.com</p>
                        <button class="logout-btn">Logout</button>
                    </div>
                </div>   
            </nav>
        </header>

        <main class="layout">
            <aside class="left-rail"></aside>

            <section class="feed">
                <h2 class="feed-header">Latest Posts</h2>

                <div id="posts" class="posts"></div>
                <div id="status" class="status" hidden></div>

                <!-- post structure -->
                <template id="post-template">
                    <article class="post">
                    <header class="post-head">
                        <div class="post-avatar" aria-hidden="true">
                        <img class="post-avatar-pic" alt="">
                        </div>
                        <h3 class="post-title"></h3>
                        <time class="post-date" datetime=""></time>
                    </header>

                    <!-- present only if image exists -->
                    <img class="post-img" alt="" loading="lazy" hidden>

                    <p class="post-message"></p>
                    <button class="post-like" type="button">👍</button>
                    </article>
                </template>
            </section>

            <aside class="right-rail"></aside>
        </main>

        <footer class="footer">
            <script src="res/scripts/posts.js" defer></script>
            <script src="res/scripts/dropdown.js" defer></script>
            <p>Members: Matteus Kalda, Anton Laidmets, Marcos Meitern</p>
        </footer>
    </body>    
</html>
